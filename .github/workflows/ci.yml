name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write          # dorny/test-reporter writes a Check with per-test results
  pull-requests: write   # optional: summary on the PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # Nerdbank.GitVersioning needs full history for accurate versions

      - name: Init SDK submodule (shallow)
        run: git submodule update --init --depth 1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # GHA's Docker 28 daemon-side BuildKit hits a layer-export race on multi-stage
      # builds ("failed to export image: failed to get layer sha256:... layer does not
      # exist"). The fix is to route the test suite's `docker build` calls through
      # buildx's docker-container driver, which runs an isolated BuildKit instance in
      # its own container — that path is unaffected. `--use` makes it the default
      # builder so plain `docker build` (which DockerHelper shells out to) picks it up.
      - name: Set up buildx (docker-container driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      # Docker comes pre-installed on ubuntu-latest. Tests use Testcontainers to spin up
      # mcr.microsoft.com/dotnet/sdk:10.0 containers for integration scenarios.
      - name: Build & test
        run: >
          dotnet test --project tests/NMica.Tests/NMica.Tests.csproj
          --configuration Release
          --
          --report-trx
          --results-directory ${{ github.workspace }}/artifacts/test-results

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: artifacts/test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload test results (raw)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: ignore

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  release:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: nuget-release
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
